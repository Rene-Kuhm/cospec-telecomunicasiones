services:

  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cospec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cospec
      POSTGRES_PASSWORD: cospec
      POSTGRES_DB: cospec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cospec -d cospec_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cospec_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: cospec_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO bucket setup — se ejecuta una vez y sale
  minio-setup:
    image: minio/mc:latest
    container_name: cospec_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/cospec;
        mc anonymous set private local/cospec;
        echo 'MinIO bucket cospec creado.';
      "
    restart: "no"

  # ── Mailpit (email testing — captura emails en dev) ─────────
  # Acceder a http://localhost:8025 para ver emails enviados
  mailpit:
    image: axllent/mailpit:latest
    container_name: cospec_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI → http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── Adminer (database GUI — opcional) ──────────────────────
  # Acceder a http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: cospec_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  minio_data:

# ── Uso ──────────────────────────────────────────────────────
# Levantar todo:
#   docker compose up -d
#
# Levantar solo infraestructura (sin adminer):
#   docker compose up -d postgres redis minio minio-setup mailpit
#
# Ver logs de un servicio:
#   docker compose logs -f postgres
#
# Resetear todo (borra datos):
#   docker compose down -v
#
# Conexiones locales:
#   PostgreSQL:  postgresql://cospec:cospec@localhost:5432/cospec_db
#   Redis:       redis://localhost:6379/0
#   MinIO API:   http://localhost:9000  (user: minioadmin, pass: minioadmin)
#   MinIO UI:    http://localhost:9001
#   Mailpit UI:  http://localhost:8025
#   Adminer:     http://localhost:8080
