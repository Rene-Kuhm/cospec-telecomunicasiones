[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cospec-api"
version = "0.1.0"
description = "Cospec Telecomunicaciones — Backend API"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ──────────────────────────────────────
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",   # file uploads / form data

    # ── Validation & config ────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # ── Database ───────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",             # async PostgreSQL driver

    # ── Cache & Queue ──────────────────────────────────────
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",                 # async task queue (usa Redis)

    # ── Auth & Security ────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # password hashing
    "bcrypt>=4.2.0",

    # ── HTTP client ────────────────────────────────────────
    "httpx>=0.27.0",               # requests async (Telegram, external APIs)

    # ── Object storage (S3/R2/MinIO) ──────────────────────
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # ── Email & SMS (Brevo / Sendinblue) ──────────────────
    "sib-api-v3-sdk>=7.6.0",

    # ── Geocoding ──────────────────────────────────────────
    "geopy>=2.4.1",

    # ── Telegram bot ───────────────────────────────────────
    "python-telegram-bot>=21.0",

    # ── Excel export ───────────────────────────────────────
    "openpyxl>=3.1.5",

    # ── Structured logging ─────────────────────────────────
    "structlog>=24.4.0",

    # ── SSE ────────────────────────────────────────────────
    "sse-starlette>=2.1.3",        # Server-Sent Events para FastAPI

    # ── Date/time ──────────────────────────────────────────
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    # ── Testing ────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",               # async TestClient para FastAPI
    "aiosqlite>=0.20.0",           # SQLite async driver for in-memory tests
    "factory-boy>=3.3.1",          # fixtures / factories
    "faker>=30.0.0",               # datos fake para tests

    # ── Linting & formatting ───────────────────────────────
    "ruff>=0.8.0",                 # linter + formatter (reemplaza flake8+black+isort)
    "mypy>=1.13.0",                # type checking

    # ── Stubs ──────────────────────────────────────────────
    "types-python-dateutil>=2.9.0",
    "types-passlib>=1.7.7",
    "boto3-stubs[s3]>=1.35.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (no print statements)
    "ANN", # type annotations
]
ignore = [
    "ANN101",  # self type annotation
    "ANN102",  # cls type annotation
    "S101",    # assert allowed in tests
]

[tool.ruff.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20"]
"migrations/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Comandos de desarrollo ────────────────────────────────────
# Instalar dependencias:
#   uv venv .venv && source .venv/bin/activate  (Linux/Mac)
#   uv venv .venv && .venv\Scripts\activate      (Windows)
#   uv pip install -e ".[dev]"
#
# Correr servidor:
#   uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
#
# Correr worker ARQ:
#   arq app.workers.main.WorkerSettings
#
# Migraciones:
#   alembic revision --autogenerate -m "descripcion"
#   alembic upgrade head
#   alembic downgrade -1
#
# Tests:
#   pytest
#   pytest tests/unit/ -v
#   pytest tests/integration/ -v
#
# Linting:
#   ruff check .
#   ruff format .
#   mypy app/
